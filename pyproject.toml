[project]
name = "beruang"
version = "0.1.0"
description = "Investment App MVP — monthly installment tracker with MoM growth and portfolio trend"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy-financial>=1.0",
    "yfinance>=0.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.0",
    "ruff>=0.12",
    "pytest>=8.0",
    "httpx>=0.27",
    "anyio>=4.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["*.py"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true