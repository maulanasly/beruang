services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: beruang-backend
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: beruang-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
