services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beruang
    ports:
      - "8000:8000"
    environment:
      RUST_LOG: info
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://127.0.0.1:8000/health | grep -q ok || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
