# beruang — nginx reverse proxy for kalkulator (80 -> 127.0.0.1:8000).
# Serves kalkulator.rayakala.ink (canonical) + kalkulator.rayakala.id and
# hitung.rayakala.id. Apex + www .id are left for rayakala-landing.
# Coexists with the monthly-logs vhost (which holds `default_server`).
# Install: cp to /etc/nginx/sites-available/beruang,
# symlink into sites-enabled, then `nginx -t && systemctl reload nginx`.
# TLS: sudo bash scripts/setup-tls.sh (certbot --nginx adds the :443 block + http->https redirect).
upstream beruang {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    listen [::]:80;
    server_name kalkulator.rayakala.ink kalkulator.rayakala.id hitung.rayakala.id;

    client_max_body_size 5m;

    # Frontend is a static SPA + JSON API; allow default buffering.
    location / {
        proxy_pass http://beruang;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
