services:
  calc:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: beruang-calc
    expose:
      - "8001"
    command: ["python", "-m", "uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      CORS_ALLOW_ORIGINS: "http://localhost:8000,http://127.0.0.1:8000,http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2).read() else 1)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  gateway:
    build:
      context: .
      dockerfile: rust-gateway/Dockerfile
    container_name: beruang-gateway
    depends_on:
      calc:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      CALC_BASE_URL: http://calc:8001
      RUST_LOG: info
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://127.0.0.1:8000/health | grep -q ok || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Legacy Vue frontend kept for migration; prefer gateway's embedded static/
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: beruang-frontend
    depends_on:
      - gateway
    ports:
      - "8080:80"
    profiles: ["legacy"]
